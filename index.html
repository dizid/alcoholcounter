<!doctype html>
<html lang="en">
  <head>
    <!-- Google Analytics loads only after consent: src/lib/analytics.js (T-0609) -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DrinkTracker: free app to track your drinking and cut down</title>
    <meta name="description" content="Free, private app to track your drinking and cut down: log a drink in one tap, set a daily and weekly limit, count alcohol-free days and see your patterns." />
    <!-- No canonical link here on purpose: src/lib/pageMeta.js sets one per page (T-0636).
         Google's advice when JavaScript sets the canonical is to leave it out of the HTML. -->
    <meta name="theme-color" content="#12100E" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook (link previews don't run JavaScript, so these describe the site) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alcohol.dizid.com/" />
    <meta property="og:title" content="DrinkTracker: free app to track your drinking and cut down" />
    <meta property="og:description" content="Log a drink in one tap, set a daily and weekly limit, count alcohol-free days and see your patterns. Free, private, no ads." />
    <meta property="og:site_name" content="DrinkTracker" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DrinkTracker: free app to track your drinking and cut down" />
    <meta name="twitter:description" content="Log a drink in one tap, set a daily and weekly limit, count alcohol-free days and see your patterns. Free, private, no ads." />

    <!-- JSON-LD Structured Data: keep featureList true to what the app does (checked Nov 20 2026) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "DrinkTracker",
      "url": "https://alcohol.dizid.com/",
      "description": "Free, private web app to track your drinking and cut down: one-tap logging in standard drinks, daily and weekly limits, alcohol-free days and week, month and year insights.",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      },
      "creator": {
        "@type": "Organization",
        "name": "Dizid Web Development",
        "url": "https://dizid.com"
      },
      "featureList": [
        "One-tap drink logging in standard drinks",
        "Daily and weekly drink limits",
        "Goal for alcohol-free days per week",
        "Week, month and year insights",
        "Optional trigger, mood and note per drink",
        "Breathing and urge-surfing exercises",
        "Optional AI coach that asks before sending anything",
        "Export your data as CSV"
      ]
    }
    </script>

    <!-- Fraunces (numbers, headings) + Inter (text), T-0588 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
